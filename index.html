<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OctoEnt</title>
    <meta name="description" content="OctoEnt builds Amicado and Vidikon.">
    <link rel="canonical" href="https://octoent.com/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #0a0a0f;
            color: #fefeff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
        }
        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        h1 { font-size: 3em; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 28px; }
        ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
        a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 1.1em; }
        a:hover { color: #fff; }
        p.contact { margin-top: 40px; font-size: 0.9em; color: rgba(255,255,255,0.45); }
        p.contact a { font-size: 1em; }
    </style>
</head>
<body>
    <main>
        <h1>OctoEnt</h1>
        <ul>
            <li><a href="https://amicado.app/">Amicado</a></li>
            <li><a href="/vidikon-legal/">Vidikon</a></li>
        </ul>
        <p class="contact"><a href="mailto:vlad@octoent.com">vlad@octoent.com</a></p>
    </main>
</body>
</html>
